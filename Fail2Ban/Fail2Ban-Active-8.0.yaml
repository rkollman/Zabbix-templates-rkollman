zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 03584917443648b39caab82b8c357a12
      template: 'Fail2ban by Zabbix agent active'
      name: 'Fail2ban by Zabbix agent active'
      description: |
        Based upon the template as provided by initMAX, but changed to Zabbix agent active items for Zabbix agents active by Raimond Kollman
        
        Make sure the following lines are saved as a UserParameter-file or as UserParameters in the Agent configuration:
        
        UserParameter=fail2ban.status[*],sudo /usr/bin/fail2ban-client status '$1'
        UserParameter=fail2ban.discovery,sudo /usr/bin/fail2ban-client status | grep 'Jail list:' | sed -e 's/^.*:\W\+//' -e 's/\(\(\w\|-\)\+\)/{"{#JAIL}":"\1"}/g' -e 's/.*/{"data":[\0]}/'
        
        Also make sure that the Zabbix user has rights to execute fail2ban-client, this can for example be done by adding this to your sudo-configuration:
                
                zabbix ALL=NOPASSWD: /usr/bin/fail2ban-client status
                zabbix ALL=NOPASSWD: /usr/bin/fail2ban-client status *
        
        The original template can be found on also with the needed Userparameters. https://git.initmax.cz/initMAX-Public/zabbix-templates
      vendor:
        name: 'Raimond Kollman'
        version: 8.0-0
      groups:
        - name: Templates/Applications
      items:
        - uuid: b3aa0debb4d149cbb9e990d06df9537e
          name: 'Fail2Ban service status'
          type: ZABBIX_ACTIVE
          key: 'proc.num[,,,fail2ban]'
          history: 7d
          trends: 90d
          valuemap:
            name: 'Service state'
          preprocessing:
            - type: IN_RANGE
              parameters:
                - '0'
                - '1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '1'
          tags:
            - tag: Application
              value: Fail2ban
            - tag: RAW
          triggers:
            - uuid: e349a261f4f24731b0d080d5242774c9
              expression: 'max(/Fail2ban by Zabbix agent active/proc.num[,,,fail2ban],#3)=0'
              name: 'Fail2ban server is not running!'
              priority: HIGH
              tags:
                - tag: App
                  value: Fail2ban
      discovery_rules:
        - uuid: d16301664e0246109b5d3f5e4ce61402
          name: 'Fail2ban discovery'
          type: ZABBIX_ACTIVE
          key: fail2ban.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#JAIL}'
                value: '{$FAIL2BAN.MATCHES}'
              - macro: '{#JAIL}'
                value: '{$FAIL2BAN.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovery of jails from fail2ban daemon.'
          item_prototypes:
            - uuid: 4b9dc52e9da340c2a7d2cf261fc0d420
              name: 'Fail2ban {#JAIL}: banned IPs (count)'
              type: DEPENDENT
              key: 'fail2ban.actions.curr_banned[{#JAIL}]'
              history: 7d
              preprocessing:
                - type: REGEX
                  parameters:
                    - 'Currently banned:\s+(\d+)'
                    - \1
              master_item:
                key: 'fail2ban.status[{#JAIL}]'
              tags:
                - tag: Application
                  value: Fail2ban
                - tag: Service
                  value: '{#JAIL}'
              trigger_prototypes:
                - uuid: 88b1944debfe426585fffde95d5a0727
                  expression: 'last(/Fail2ban by Zabbix agent active/fail2ban.actions.curr_banned[{#JAIL}])>{$CURRENTLY.BANNED.IPS.EXCEEDS}'
                  name: 'Fail2ban {#JAIL}: currently banned IPs exceeds {$CURRENTLY.BANNED.IPS.EXCEEDS}'
                  event_name: 'Fail2ban {#JAIL}: banned IPs exceed {$CURRENTLY.BANNED.IPS.EXCEEDS} (now {ITEM.LASTVALUE})'
                  priority: HIGH
                - uuid: 27a4651432954cd38338670a8d5f50e5
                  expression: 'last(/Fail2ban by Zabbix agent active/fail2ban.actions.curr_banned[{#JAIL}])>{$CURRENTLY.BANNED.IPS.WARN}'
                  name: 'Fail2ban {#JAIL}: currently banned IPs exceeds {$CURRENTLY.BANNED.IPS.WARN}'
                  event_name: 'Fail2ban {#JAIL}: banned IPs exceed {$CURRENTLY.BANNED.IPS.WARN} (now {ITEM.LASTVALUE})'
                  priority: WARNING
            - uuid: 16ff6d6d0c8a461cb85272e5de933b90
              name: 'Fail2ban {#JAIL}: banned IPs (list)'
              type: DEPENDENT
              key: 'fail2ban.actions.ip_list[{#JAIL}]'
              history: 1d
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // Extract the full “Banned IP list:” line
                      var m = value.match(/Banned IP list:\s*(.*)$/);
                      if (!m || !m[1]) {
                          return '';               // no IPs → return empty string
                      }
                      
                      // Split on whitespace, zahodí prázdné položky, seřadí a spojí do řádků
                      var ips = m[1].trim().split(/\s+/)
                                     .filter(String)     // odstraní případné prázdné prvky
                                     .sort();            // stabilní pořadí (lexikograficky)
                      
                      return ips.join('\n');
              master_item:
                key: 'fail2ban.status[{#JAIL}]'
              tags:
                - tag: Application
                  value: Fail2ban
                - tag: Service
                  value: '{#JAIL}'
            - uuid: ca40bdbc98b9498ebb64a6a3a0b8c906
              name: 'Fail2ban {#JAIL}: IPs ever banned (total)'
              type: DEPENDENT
              key: 'fail2ban.actions.total_banned[{#JAIL}]'
              history: 7d
              preprocessing:
                - type: REGEX
                  parameters:
                    - 'Total banned:\s+(\d+)'
                    - \1
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'fail2ban.status[{#JAIL}]'
              tags:
                - tag: Application
                  value: Fail2ban
                - tag: Service
                  value: '{#JAIL}'
            - uuid: ca22802aefb44777bbd9bb53eca383cc
              name: 'Fail2ban {#JAIL}: log‑in attempts currently failed'
              type: DEPENDENT
              key: 'fail2ban.filter.curr_failed[{#JAIL}]'
              history: 7d
              preprocessing:
                - type: REGEX
                  parameters:
                    - 'Currently failed:\s+(\d+)'
                    - \1
              master_item:
                key: 'fail2ban.status[{#JAIL}]'
              tags:
                - tag: Application
                  value: Fail2ban
                - tag: Service
                  value: '{#JAIL}'
            - uuid: 4b553a6d69c84691943f7bda101c7c7b
              name: 'Fail2ban {#JAIL}: failed log‑ins (total)'
              type: DEPENDENT
              key: 'fail2ban.filter.total_failed[{#JAIL}]'
              history: 7d
              preprocessing:
                - type: REGEX
                  parameters:
                    - 'Total failed:\s+(\d+)'
                    - \1
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'fail2ban.status[{#JAIL}]'
              tags:
                - tag: Application
                  value: Fail2ban
                - tag: Service
                  value: '{#JAIL}'
              trigger_prototypes:
                - uuid: 388afe94b81f4762aef322fa38e7eff8
                  expression: |
                    last(/Fail2ban by Zabbix agent active/fail2ban.filter.total_failed[{#JAIL}]) -
                    first(/Fail2ban by Zabbix agent active/fail2ban.filter.total_failed[{#JAIL}],{$SPIKE.IN.FAILED.LOGINS_TIME}) > {$SPIKE.IN.FAILED.LOGINS}
                  name: 'Fail2ban {#JAIL}: spike in failed logins (> {$SPIKE.IN.FAILED.LOGINS})'
                  priority: HIGH
            - uuid: aa5e86fd0e21491aafddd910c23f6abc
              name: 'Fail2ban {#JAIL} status'
              type: ZABBIX_ACTIVE
              key: 'fail2ban.status[{#JAIL}]'
              history: '0'
              value_type: TEXT
              tags:
                - tag: Application
                  value: Fail2ban
                - tag: RAW
                - tag: Service
                  value: '{#JAIL}'
          graph_prototypes:
            - uuid: 1171d5f2ff9d4d81a6910670e3e96319
              name: 'Count of banned IPs on jail {#JAIL}'
              ymin_type_1: FIXED
              graph_items:
                - color: FF0000
                  item:
                    host: 'Fail2ban by Zabbix agent active'
                    key: 'fail2ban.actions.curr_banned[{#JAIL}]'
                - sortorder: '1'
                  color: FFBF00
                  calc_fnc: ALL
                  item:
                    host: 'Fail2ban by Zabbix agent active'
                    key: 'fail2ban.filter.curr_failed[{#JAIL}]'
      macros:
        - macro: '{$CURRENTLY.BANNED.IPS.EXCEEDS}'
          value: '100'
          description: 'High threshold: trigger when current banned IPs exceed this number. Override per jail with context, e.g. {$CURRENTLY.BANNED.IPS.EXCEEDS:nginx-botsearch}'
        - macro: '{$CURRENTLY.BANNED.IPS.WARN}'
          value: '5'
          description: 'Warning threshold: trigger when current banned IPs exceed this number. Override per jail with context, e.g. {$CURRENTLY.BANNED.IPS.WARN:nginx-botsearch}'
        - macro: '{$FAIL2BAN.MATCHES}'
          value: '.*'
          description: 'Regex: jails to include in discovery (default = all)'
        - macro: '{$FAIL2BAN.NOT_MATCHES}'
          value: TEST|TEST2
          description: 'Regex: jails to exclude from discovery'
        - macro: '{$SPIKE.IN.FAILED.LOGINS}'
          value: '10'
          description: 'Threshold: number of new failed logins within {$SPIKE.IN.FAILED.LOGINS_TIME}'
        - macro: '{$SPIKE.IN.FAILED.LOGINS_TIME}'
          value: 5m
          description: 'Time window used in spike trigger (e.g. 5m, 10m)'
      dashboards:
        - uuid: 632218987ec2457eb4fb9102e20be389
          name: Fail2ban
          auto_start: 'YES'
          pages:
            - widgets:
                - type: item
                  name: 'Fail2ban service'
                  width: '14'
                  fields:
                    - type: ITEM
                      name: itemid.0
                      value:
                        host: 'Fail2ban by Zabbix agent active'
                        key: 'proc.num[,,,fail2ban]'
                    - type: STRING
                      name: thresholds.0.color
                      value: FF0000
                    - type: STRING
                      name: thresholds.0.threshold
                      value: '0'
                    - type: STRING
                      name: thresholds.1.color
                      value: 43A047
                    - type: STRING
                      name: thresholds.1.threshold
                      value: '1'
                - type: itemnavigator
                  name: 'Jail navigator'
                  'y': '2'
                  width: '14'
                  height: '6'
                  fields:
                    - type: INTEGER
                      name: group_by.0.attribute
                      value: '3'
                    - type: STRING
                      name: group_by.0.tag_name
                      value: Service
                    - type: INTEGER
                      name: item_tags.0.operator
                      value: '1'
                    - type: STRING
                      name: item_tags.0.tag
                      value: Application
                    - type: STRING
                      name: item_tags.0.value
                      value: Fail2ban
                    - type: INTEGER
                      name: item_tags.1.operator
                      value: '5'
                    - type: STRING
                      name: item_tags.1.tag
                      value: RAW
                    - type: STRING
                      name: item_tags.1.value
                      value: ''
                    - type: STRING
                      name: reference
                      value: FLIDJ
                - type: svggraph
                  x: '14'
                  width: '58'
                  height: '6'
                  fields:
                    - type: STRING
                      name: ds.0.color.0
                      value: FF465C
                    - type: INTEGER
                      name: ds.0.dataset_type
                      value: '0'
                    - type: STRING
                      name: ds.0.itemids.0._reference
                      value: FLIDJ._itemid
                    - type: INTEGER
                      name: ds.0.missingdatafunc
                      value: '3'
                    - type: STRING
                      name: lefty_min
                      value: '0'
                    - type: INTEGER
                      name: legend_statistic
                      value: '1'
                    - type: STRING
                      name: reference
                      value: FTXDT
                    - type: INTEGER
                      name: righty
                      value: '0'
                - type: item
                  x: '14'
                  'y': '6'
                  width: '30'
                  fields:
                    - type: INTEGER
                      name: decimal_places
                      value: '0'
                    - type: STRING
                      name: itemid._reference
                      value: FLIDJ._itemid
                    - type: INTEGER
                      name: show.0
                      value: '2'
                - type: honeycomb
                  name: 'Blocked IPs'
                  x: '44'
                  'y': '6'
                  width: '28'
                  fields:
                    - type: STRING
                      name: items.0
                      value: '*banned IPs (count)'
                    - type: STRING
                      name: primary_label
                      value: '{{ITEM.NAME}.regsub("Fail2ban\s+(.*)\:\s+banned IPs \(count\)", \1)}'
                    - type: STRING
                      name: reference
                      value: AOZHT
                    - type: INTEGER
                      name: secondary_label_decimal_places
                      value: '0'
                    - type: STRING
                      name: thresholds.0.color
                      value: 43A047
                    - type: STRING
                      name: thresholds.0.threshold
                      value: '0'
                    - type: STRING
                      name: thresholds.1.color
                      value: FFD54F
                    - type: STRING
                      name: thresholds.1.threshold
                      value: '5'
                    - type: STRING
                      name: thresholds.2.color
                      value: FF0000
                    - type: STRING
                      name: thresholds.2.threshold
                      value: '10'
      valuemaps:
        - uuid: c6ca582f074e4638b0f0bf7e6fef43aa
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
